<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zimamoto/Maafa — April 2025</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #b30000; }
    .navbar a, .navbar-brand { color: white !important; }
    .card {
      border-radius: 15px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }
    #table_div table { color: black !important; font-weight: 500; }
    #table_div table th {
      background-color: #f2f2f2 !important;
      color: black !important;
      font-weight: bold !important;
    }
  </style>
</head>
<body>

  <!-- 🌐 Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Zimamoto/Maafa Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="January.html">January</a></li>
          <li class="nav-item"><a class="nav-link" href="February.html">February</a></li>
          <li class="nav-item"><a class="nav-link" href="March.html">March</a></li>
          <li class="nav-item"><a class="nav-link active" href="April.html">April</a></li>
        </ul>
        <select class="form-select form-select-sm w-auto">
          <option selected>2025</option>
          <option>2026</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- 🧾 Cards -->
  <div class="container my-4">
    <div class="row text-center">
      <div class="col-md-4 mb-3 d-flex">
        <div class="card bg-danger text-white p-3 flex-fill">
          <h5>Jumla ya Ajali kwa Mkoa</h5>
          <h2 id="totalMkoa">0</h2>
        </div>
      </div>
      <div class="col-md-4 mb-3 d-flex">
        <div class="card bg-warning text-dark p-3 flex-fill">
          <h5>Jumla ya Ajali kwa Wilaya</h5>
          <h2 id="totalWilaya">0</h2>
        </div>
      </div>
      <div class="col-md-4 mb-3 d-flex">
        <div class="card bg-success text-white p-3 flex-fill">
          <h5>Jumla ya Aina za Ajali</h5>
          <h2 id="totalAina">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 📊 Charts -->
  <div class="container p-4" style="background-color:#b30000;color:white;font-size:larger;border-radius:10px;">
    <h2 class="text-center mb-4">Charts Zimamoto/Maafa — April 2025</h2>
    <div class="mb-5">
      <h4>Idadi ya Ajali kwa Mkoa</h4>
      <div id="chart_div" style="height:400px;"></div>
    </div>
    <div class="mb-5">
      <h4>Idadi ya Ajali kwa Wilaya</h4>
      <div id="pie_chart" style="height:400px;"></div>
    </div>
    <div class="mb-5">
      <h4>Aina za Ajali na Idadi Zake</h4>
      <div id="table_div"></div>
    </div>
  </div>

  <!-- 📈 JS -->
  <script>
    google.charts.load('current', {'packages':['corechart','bar','table']});
    google.charts.setOnLoadCallback(drawAllCharts);

    function drawAllCharts(){
      drawMotivationChart();
      drawPieChart();
      drawTable();
      updateTotals();
    }

    function drawMotivationChart(){
      const data = google.visualization.arrayToDataTable([
        ['Mkoa','Idadi ya Ajali'],
        ['Kaskazini Pemba',1],
        ['Kaskazini Unguja',9],
        ['Kusini Pemba',2],
        ['Kusini Unguja',6],
        ['Mjini Magharibi',40]
      ]);
      const options={title:'Idadi ya Ajali kwa Mkoa',legend:'none',colors:['#ffc107']};
      new google.visualization.ColumnChart(document.getElementById('chart_div')).draw(data,options);
    }

    function drawPieChart(){
      const data = google.visualization.arrayToDataTable([
        ['Wilaya','Idadi ya Ajali'],
        ['Wilaya ya Kaskazini A',2],
        ['Wilaya ya ChakeChake',1],
        ['Wilaya ya Kaskazini B',1],
        ['Wilaya ya Kusini',4],
        ['Wilaya ya Magharibi A',12],
        ['Wilaya ya Magharibi B',10],
        ['Wilaya ya Micheweni',1],
        ['Wilaya ya Mjini',24],
        ['Wilaya ya Kati',1],
        ['Wilaya ya Wete',1]
      ]);
      const options={title:'Idadi ya Ajali kwa Wilaya',is3D:true,pieSliceText:'percentage'};
      new google.visualization.PieChart(document.getElementById('pie_chart')).draw(data,options);
    }

    function drawTable(){
      const data=new google.visualization.DataTable();
      data.addColumn('string','Aina za Ajali');
      data.addColumn('number','Idadi za Ajali');
      data.addRows([
        ['Kungua nyumba na majengo ya Taasisi',21],
        ['Kuungua kwa hoteli',5],
        ['Ajali za ndege',0],
        ['Moto wa sheli',0],
        ['Moto wa transfoma na nguzo za umeme',16],
        ['Moto wa misitu na mashamba',0],
        ['Ajali za gari/moto wa gari/pikipiki',4],
        ['Ajali za meli/jahazi',0],
        ['Moto wa jaa',1],
        ['Matukio ya miti kuanguka na kuziba njia',3],
        ['Kujinyonga',0],
        ['Watu/wanyama waliyozama baharini, visima n.k',3],
        ['Moto sehemu za biashara (maduka, masoko)',5],
        ['Matukio ya uongo',0],
        ['Mengineyo',0]
      ]);
      new google.visualization.Table(document.getElementById('table_div')).draw(data,{showRowNumber:true,width:'100%'});
    }

    function updateTotals(){
      const mikoa=[1,9,2,6,40], wilaya=[2,2,1,4,12,10,1,24,1,1], aina=[21,5,0,0,16,0,4,0,1,3,0,3,5,0,0];
      document.getElementById('totalMkoa').innerText=mikoa.reduce((a,b)=>a+b,0);
      document.getElementById('totalWilaya').innerText=wilaya.reduce((a,b)=>a+b,0);
      document.getElementById('totalAina').innerText=aina.reduce((a,b)=>a+b,0);
    }

    let resizeTimer;
    window.addEventListener('resize',()=>{
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(drawAllCharts,300);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
