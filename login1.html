<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: red;
            font-family: Arial, sans-serif;
        flex-direction: column;
        min-height: 100vh;
        text-align: center;
        }
        .login-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
      
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group input {
            width: 85%;
            padding: 10px 35px 10px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        .input-group i {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            color: #999;
        }
        .input-group input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .forgot-password {
            text-align: center;
            margin-top: 10px;
        }
        .forgot-password a {
            text-decoration: none;
            color: #007bff;
            cursor: pointer;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 15px;
            color: red;
            text-align: center;
        }

        /* Forgot Password Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            position: relative;
        }
        .close {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 20px;
            color: #333;
            cursor: pointer;
        }
        .close:hover {
            color: red;
        }
        #resetEmail {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        #resetBtn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        #resetBtn:hover {
            background: #0056b3;
        }
       
    </style>
</head>
<body>
   
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <i>&#128100;</i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i>&#128274;</i>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="forgot-password">
            <a id="forgotLink">Forgot Password?</a>
        </div>
        <div class="message" id="message"></div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h3>Reset Password</h3>
            <p>Enter your email or username to reset your password.</p>
            <input type="text" id="resetEmail" placeholder="Email or Username">
            <button id="resetBtn">Send Reset Link</button>
            <p id="resetMessage" style="color:green; margin-top:10px;"></p>
        </div>
    </div>

    <script>
        // Sample user data
        const users = {
             "testUser": "testPassword",
            "newUser": "newPassword123",
            "rauhiaabdallah43@gmail.com": "12345",
            "admin": "1234"
        };

        const loginForm = document.getElementById("loginForm");
        const messageElement = document.getElementById("message");

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (users[username] && users[username] === password) {
                messageElement.style.color = "green";
                messageElement.textContent = "Loading...";

                // Clear input fields
               
        
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
  

                setTimeout(() => {
                    window.location.href = "https://mail.google.com/mail/u/4/#inbox";
                }, 1000);
            } else {
                messageElement.style.color = "red";
                messageElement.textContent = "Invalid username or password!";
            }
        });

        // Forgot password modal logic
        const modal = document.getElementById("forgotModal");
        const forgotLink = document.getElementById("forgotLink");
        const closeModal = document.getElementById("closeModal");
        const resetBtn = document.getElementById("resetBtn");
        const resetMessage = document.getElementById("resetMessage");

        forgotLink.onclick = () => modal.style.display = "block";
        closeModal.onclick = () => {
            modal.style.display = "none";
            resetMessage.textContent = "";
            document.getElementById("resetEmail").value = "";
        };
        window.onclick = (event) => {
            if (event.target == modal) modal.style.display = "none";
        };

        resetBtn.onclick = () => {
            const emailOrUser = document.getElementById("resetEmail").value.trim();
            if (emailOrUser === "") {
                resetMessage.style.color = "red";
                resetMessage.textContent = "Please enter your email or username.";
                return;
            }
            resetMessage.style.color = "green";
            resetMessage.textContent = "Password reset link has been sent to your email!";
            setTimeout(() => {
                modal.style.display = "none";
            }, 2000);
        };

         

      function handleFormSubmit(form) {
        event.preventDefault();
        alert("Form submitted successfully!");
      }
    </script>
</body>
</html>
