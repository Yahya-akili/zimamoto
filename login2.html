<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f70303, #814343, #503e3e);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .login-form {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-form:hover {
            transform: translateY(-5px);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 42px;
            color: #2c5364;
            background: #e4f1fe;
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(44, 83, 100, 0.2);
        }
        
        .logo h1 {
            margin-top: 15px;
            color: #203a43;
            font-weight: 600;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e6e6e6;
            background: #f9f9f9;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: #2c5364;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(44, 83, 100, 0.2);
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #2c5364;
            font-size: 18px;
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .remember {
            color: #555;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .remember input {
            margin-right: 8px;
            accent-color: #2c5364;
        }
        
        .forgot-password {
            color: #2c5364;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }
        
        .forgot-password:hover {
            color: #203a43;
            text-decoration: underline;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            color: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(33, 147, 176, 0.3);
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #1a7c95, #4ec0e4);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(33, 147, 176, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .separator {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #777;
        }
        
        .separator::before,
        .separator::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        
        .separator span {
            padding: 0 15px;
            font-size: 14px;
        }
        
        .signup {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        
        .signup a {
            color: #2193b0;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .signup a:hover {
            color: #1a7c95;
            text-decoration: underline;
        }
        
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close {
            font-size: 24px;
            cursor: pointer;
            color: #777;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #e6e6e6;
            border-radius: 10px;
            font-size: 16px;
        }
        
        /* Dashboard Styles */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info i {
            font-size: 32px;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 50%;
        }
        
        .user-details h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        .user-details p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: white;
            color: #2193b0;
        }
        
        .dashboard-content {
            padding: 30px;
        }
        
        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .welcome-section h1 {
            color: #203a43;
            margin-bottom: 15px;
            font-size: 32px;
        }
        
        .welcome-section p {
            color: #555;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card i {
            font-size: 36px;
            color: #2193b0;
            margin-bottom: 15px;
        }
        
        .stat-card h3 {
            font-size: 18px;
            color: #203a43;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            font-size: 32px;
            font-weight: 700;
            color: #2c5364;
        }
        
        .dashboard-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 5px 15px rgba(33, 147, 176, 0.3);
        }
        
        .action-btn:hover {
            background: linear-gradient(135deg, #1a7c95, #4ec0e4);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(33, 147, 176, 0.4);
        }
        
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            
            .user-info {
                flex-direction: column;
            }
            
            .user-info i {
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .login-form {
                padding: 30px 25px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
            
            .dashboard-content {
                padding: 20px;
            }
            
            .welcome-section h1 {
                font-size: 26px;
            }
            
            .welcome-section p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="loginContainer">
        <form class="login-form" id="loginForm">
            <div class="logo">
                <i class="fas fa-lock"></i>
                <h1>Account Login</h1>
            </div>
            
            <div id="message" class="message"></div>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username or Email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-password" id="forgotPassword">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn">Login</button>
            
            <div class="separator">
                <span></span>
            </div>
            
            <div class="signup">
                <a href="#" id="signUp">.</a>
            </div>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <div class="user-details">
                    <h2 id="dashboardUserName">Demo User</h2>
                    <p id="dashboardUserEmail">demo@example.com</p>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="dashboard-content">
            <div class="welcome-section">
                <h1>Karibu katika dashibodi ya Zimamoto!</h1>
                <p>Bonyeza kitufe apa chini uingie kwenye takwimu za zimamoto</p>
            </div>
            
            <!--<div class="stats-cards">
                <div class="stat-card">
                    <i class="fas fa-chart-line"></i>
                    <h3>Performance Score</h3>
                    <p>87%</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-tasks"></i>
                    <h3>Completed Tasks</h3>
                    <p>24/30</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-bell"></i>
                    <h3>Notifications</h3>
                    <p>5</p>
                </div>
            </div>-->
            
            <div class="dashboard-actions">
                <button class="action-btn"><a href="https://mail.google.com/mail/u/4/#inbox">Takwimu </a></button>
                <!--<button class="action-btn"><i class="fas fa-cog"></i> Settings</button>
                <button class="action-btn"><i class="fas fa-shield-alt"></i> Security</button>
                <button class="action-btn"><i class="fas fa-question-circle"></i> Help</button>-->
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Password</h2>
                <span class="close" id="closeForgot">&times;</span>
            </div>
            <p>Enter your email address and we'll send you a password reset link.</p>
            <input type="email" class="modal-input" id="resetEmail" placeholder="Your email address">
            <button class="btn" id="sendReset">Send Reset Link</button>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal" id="signupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Account</h2>
                <span class="close" id="closeSignup">&times;</span>
            </div>
            <input type="text" class="modal-input" id="newName" placeholder="Full Name">
            <input type="email" class="modal-input" id="newEmail" placeholder="Email Address">
            <input type="password" class="modal-input" id="newPassword" placeholder="Password">
            <input type="password" class="modal-input" id="confirmPassword" placeholder="Confirm Password">
            <button class="btn" id="createAccount">Create Account</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const loginContainer = document.getElementById('loginContainer');
        const dashboard = document.getElementById('dashboard');
        const messageDiv = document.getElementById('message');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const signUpLink = document.getElementById('signUp');
        const forgotModal = document.getElementById('forgotModal');
        const signupModal = document.getElementById('signupModal');
        const closeForgot = document.getElementById('closeForgot');
        const closeSignup = document.getElementById('closeSignup');
        const sendResetBtn = document.getElementById('sendReset');
        const createAccountBtn = document.getElementById('createAccount');
        const logoutBtn = document.getElementById('logoutBtn');
        const dashboardUserName = document.getElementById('dashboardUserName');
        const dashboardUserEmail = document.getElementById('dashboardUserEmail');

        // Initialize user database in localStorage if not exists
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([
                { username: 'demo', email: 'demo@example.com', password: 'password123', name: 'Demo User' }
            ]));
        }

        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (currentUser) {
                showDashboard(JSON.parse(currentUser));
            }
        });

        // Show message function
        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Show dashboard function
        function showDashboard(user) {
            loginContainer.style.display = 'none';
            dashboard.style.display = 'block';
            dashboardUserName.textContent = user.name;
            dashboardUserEmail.textContent = user.email;
        }

        // Login form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Simulate backend validation
            const users = JSON.parse(localStorage.getItem('users'));
            const user = users.find(u => 
                (u.username === username || u.email === username) && u.password === password
            );
            
            if (user) {
                showMessage('Login successful!', 'success');
                
                // Store session if remember me is checked
                if (remember) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                } else {
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                }
                
                // Show dashboard
                setTimeout(() => {
                    showDashboard(user);
                }, 1000);
            } else {
                showMessage('Invalid username or password', 'error');
            }
        });

        // Forgot password functionality
        forgotPasswordLink.addEventListener('click', function(e) {
            e.preventDefault();
            forgotModal.style.display = 'flex';
        });

        // Sign up functionality
        signUpLink.addEventListener('click', function(e) {
            e.preventDefault();
            signupModal.style.display = 'flex';
        });

        // Close modals
        closeForgot.addEventListener('click', function() {
            forgotModal.style.display = 'none';
        });

        closeSignup.addEventListener('click', function() {
            signupModal.style.display = 'none';
        });

        // Send password reset
        sendResetBtn.addEventListener('click', function() {
            const email = document.getElementById('resetEmail').value;
            const users = JSON.parse(localStorage.getItem('users'));
            
            if (users.some(user => user.email === email)) {
                showMessage('Password reset link has been sent to your email', 'success');
                forgotModal.style.display = 'none';
            } else {
                showMessage('Email address not found', 'error');
            }
        });

        // Create new account
        createAccountBtn.addEventListener('click', function() {
            const name = document.getElementById('newName').value;
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users'));
            
            if (users.some(user => user.email === email)) {
                showMessage('Email already registered', 'error');
                return;
            }
            
            // Create username from email
            const username = email.split('@')[0];
            
            // Add new user
            users.push({
                username: username,
                email: email,
                password: password,
                name: name
            });
            
            localStorage.setItem('users', JSON.stringify(users));
            showMessage('Account created successfully! You can now login.', 'success');
            signupModal.style.display = 'none';
        });

        // Logout functionality
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            dashboard.style.display = 'none';
            loginContainer.style.display = 'block';
            loginForm.reset();
            showMessage('You have been logged out successfully', 'success');
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(e) {
            if (e.target === forgotModal) {
                forgotModal.style.display = 'none';
            }
            if (e.target === signupModal) {
                signupModal.style.display = 'none';
            }
        });
    </script>
</body>

</html>
